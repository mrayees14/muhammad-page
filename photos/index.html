
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101b30">
  <meta name="description" content="Muhammad Rayees — Photography">
  <title>Photos — Muhammad Rayees</title>

  <link rel="icon" type="image/png"
        href="https://i.imgur.com/LJmJAy9.png">

  <style>
    :root {
      --gold: #c49a52;
      --turquoise: #20b9b5;
      --background: #101b30;
      --glass: rgba(255,255,255,.07);
      --border: rgba(255,255,255,.13);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: white;
      font-family: Inter, ui-sans-serif, system-ui,
        -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    /* BACKGROUND */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at 12% 10%,
          rgba(32,185,181,.16),
          transparent 40%
        ),
        radial-gradient(
          ellipse at 90% 65%,
          rgba(196,154,82,.09),
          transparent 40%
        );
    }

    /* NAVIGATION */

    .nav {
      width: min(1200px, 90%);
      margin: auto;
      padding: 27px 0;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: var(--gold);
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: -.08em;
      text-decoration: none;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 11px 17px;

      color: white;
      text-decoration: none;
      font-size: .9rem;
      font-weight: 600;

      border: 1px solid var(--border);
      border-radius: 15px;

      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      transition: .25s ease;
    }

    .back-link:hover {
      background: rgba(255,255,255,.15);
      transform: translateY(-3px);
    }

    /* HERO */

    .hero {
      width: min(1200px, 90%);
      margin: auto;
      padding: 85px 0 55px;

      animation: appear .8s ease both;
    }

    .eyebrow {
      color: var(--turquoise);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .25em;
      text-transform: uppercase;
    }

    .hero h1 {
      max-width: 850px;
      margin: 20px 0;

      font-size: clamp(3.2rem, 8vw, 7rem);
      line-height: .98;
      letter-spacing: -.075em;
      font-weight: 850;

      background: linear-gradient(
        110deg,
        #ffffff,
        #d8e8e7,
        var(--gold)
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      max-width: 510px;
      color: rgba(255,255,255,.62);
      font-size: 1.05rem;
      line-height: 1.8;
    }

    .hero-meta {
      margin-top: 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255,255,255,.55);
      font-size: .75rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .meta-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--turquoise);
      box-shadow: 0 0 12px var(--turquoise);
    }

    /* FILTERS */

    .gallery-section {
      width: min(1200px, 90%);
      margin: auto;
      padding-bottom: 100px;
    }

    .gallery-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 26px;
    }

    .gallery-title {
      font-size: 1.1rem;
      font-weight: 750;
      letter-spacing: -.02em;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .filter {
      padding: 9px 16px;
      color: rgba(255,255,255,.65);
      font: inherit;
      font-size: .8rem;
      font-weight: 650;

      background: rgba(255,255,255,.045);
      border: 1px solid var(--border);
      border-radius: 30px;

      cursor: pointer;
      transition: .25s ease;
    }

    .filter:hover,
    .filter.active {
      color: #142229;
      background: var(--turquoise);
      border-color: var(--turquoise);
    }

    /* PHOTO GRID */

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0,1fr));
      grid-auto-rows: 48px;
      gap: 17px;
    }

    .photo-card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      padding: 0;

      border: 1px solid var(--border);
      border-radius: 19px;

      background: var(--glass);
      cursor: pointer;

      transition:
        transform .4s cubic-bezier(.2,.8,.2,1),
        opacity .3s ease,
        border-color .3s ease;
    }

    .photo-card:hover {
      transform: translateY(-5px);
      border-color: rgba(32,185,181,.55);
    }

    .photo-card.hidden {
      display: none;
    }

    .photo-card:nth-child(1) {
      grid-column: span 7;
      grid-row: span 7;
    }

    .photo-card:nth-child(2) {
      grid-column: span 5;
      grid-row: span 5;
    }

    .photo-card:nth-child(3) {
      grid-column: span 5;
      grid-row: span 5;
    }

    .photo-card:nth-child(4) {
      grid-column: span 7;
      grid-row: span 6;
    }

    .photo-card:nth-child(5) {
      grid-column: span 4;
      grid-row: span 5;
    }

    .photo-card:nth-child(6) {
      grid-column: span 4;
      grid-row: span 5;
    }

    .photo-card:nth-child(7) {
      grid-column: span 4;
      grid-row: span 5;
    }

    .photo-card:nth-child(8) {
      grid-column: span 12;
      grid-row: span 5;
    }

    /* PLACEHOLDER PHOTOS */

    .photo-placeholder {
      position: absolute;
      inset: 0;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;

      background:
        radial-gradient(
          circle at 30% 25%,
          var(--glow),
          transparent 55%
        ),
        linear-gradient(
          145deg,
          var(--shade1),
          var(--shade2)
        );
    }

    .photo-placeholder::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .2;

      background-image:
        linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.08) 1px, transparent 1px);

      background-size: 35px 35px;
    }

    .placeholder-icon {
      position: relative;
      color: rgba(255,255,255,.7);
      font-size: 2.5rem;
    }

    .placeholder-text {
      position: relative;
      color: rgba(255,255,255,.72);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    /* ACTUAL PHOTOS */

    .photo-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .7s cubic-bezier(.2,.8,.2,1);
    }

    .photo-card:hover .photo-image {
      transform: scale(1.055);
    }

    .photo-overlay {
      position: absolute;
      inset: 35% 0 0;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;

      padding: 23px;

      background: linear-gradient(
        transparent,
        rgba(0,0,0,.75)
      );

      text-align: left;
      pointer-events: none;
    }

    .photo-category {
      color: #8ce5df;
      font-size: .65rem;
      font-weight: 800;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    .photo-caption {
      margin-top: 7px;
      font-size: 1.15rem;
      font-weight: 750;
      letter-spacing: -.025em;
    }

    .photo-number {
      position: absolute;
      top: 16px;
      left: 17px;
      z-index: 2;

      color: white;
      font-size: .7rem;
      letter-spacing: .12em;

      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 20px;

      background: rgba(0,0,0,.23);
      backdrop-filter: blur(10px);
    }

    .photo-expand {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 2;

      width: 35px;
      height: 35px;

      display: grid;
      place-items: center;

      color: white;
      border-radius: 50%;
      background: rgba(0,0,0,.27);
      border: 1px solid rgba(255,255,255,.2);

      opacity: 0;
      transition: opacity .3s ease;
    }

    .photo-card:hover .photo-expand {
      opacity: 1;
    }

    /* EMPTY GALLERY MESSAGE */

    .empty-message {
      display: none;
      padding: 35px;
      color: rgba(255,255,255,.55);
      text-align: center;
    }

    /* LIGHTBOX */

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 20;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background: rgba(5,9,19,.93);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .lightbox.open {
      display: flex;
      animation: appear .25s ease both;
    }

    .lightbox img {
      max-width: min(100%,1100px);
      max-height: 85vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 20px 80px rgba(0,0,0,.5);
    }

    .lightbox-close {
      position: absolute;
      top: 22px;
      right: 25px;

      width: 44px;
      height: 44px;

      border: 1px solid rgba(255,255,255,.2);
      border-radius: 50%;

      color: white;
      background: rgba(255,255,255,.1);
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* FOOTER */

    footer {
      width: min(1200px,90%);
      margin: auto;
      padding: 30px 0 45px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;

      border-top: 1px solid var(--border);
      color: rgba(255,255,255,.4);
      font-size: .8rem;
    }

    footer a {
      color: var(--gold);
      text-decoration: none;
    }

    /* ANIMATION */

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* MOBILE */

    @media(max-width:750px) {
      .hero {
        padding-top: 65px;
      }

      .photo-grid {
        grid-template-columns: repeat(2,minmax(0,1fr));
        grid-auto-rows: 175px;
        gap: 11px;
      }

      .photo-card:nth-child(n) {
        grid-column: span 1;
        grid-row: span 2;
      }

      .photo-card:nth-child(1),
      .photo-card:nth-child(4),
      .photo-card:nth-child(8) {
        grid-column: span 2;
        grid-row: span 2;
      }

      .photo-card:nth-child(5),
      .photo-card:nth-child(6),
      .photo-card:nth-child(7) {
        grid-row: span 2;
      }

      .photo-overlay {
        padding: 14px;
      }

      .photo-caption {
        font-size: .95rem;
      }

      .gallery-top {
        align-items: flex-start;
        flex-direction: column;
      }

      .filters {
        width: 100%;
      }

      .filter {
        padding: 8px 12px;
      }
    }

    @media(prefers-reduced-motion:reduce) {
      *,*::before,*::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->

  <nav class="nav">
    <a href="/" class="logo">MR.</a>

    <a href="/" class="back-link">
      ← Back home
    </a>
  </nav>

  <!-- HERO -->

  <header class="hero">

    <span class="eyebrow">
      MUHAMMAD RAYEES / PHOTOGRAPHY
    </span>

    <h1>The world,<br>through my lens.</h1>

    <p>
      A collection of places, moments, and little details
      worth remembering.
    </p>

    <div class="hero-meta">
      <span class="meta-dot"></span>
      MY PERSONAL PHOTO COLLECTION
    </div>

  </header>

  <!-- PHOTO GALLERY -->

  <main class="gallery-section">

    <div class="gallery-top">

      <div class="gallery-title">
        Selected photographs
      </div>

      <div class="filters">

        <button class="filter active" data-filter="all">
          All photos
        </button>

        <button class="filter" data-filter="nature">
          Nature
        </button>

        <button class="filter" data-filter="places">
          Places
        </button>

        <button class="filter" data-filter="moments">
          Moments
        </button>

        <button class="filter" data-filter="details">
          Details
        </button>

      </div>

    </div>

    <div class="photo-grid" id="photoGrid">

      <!-- PHOTO 01 -->

      <button class="photo-card" data-category="nature"
              aria-label="Nature photograph">

        <span class="photo-number">01</span>

        <div class="photo-placeholder"
             style="--glow:#3d9a91;--shade1:#244d58;--shade2:#142630">

          <span class="placeholder-icon">✧</span>
          <span class="placeholder-text">Add your photo</span>

        </div>

        <div class="photo-expand">↗</div>

        <div class="photo-overlay">
          <span class="photo-category">Nature</span>
          <span class="photo-caption">Your photograph</span>
        </div>

      </button>

      <!-- PHOTO 02 -->

      <button class="photo-card" data-category="places"
              aria-label="Place photograph">

        <span class="photo-number">02</span>

        <div class="photo-placeholder"
             style="--glow:#b88c55;--shade1:#69513d;--shade2:#252b39">

          <span class="placeholder-icon">✧</span>
          <span class="placeholder-text">Add your photo</span>

        </div>

        <div class="photo-expand">↗</div>

        <div class="photo-overlay">
          <span class="photo-category">Places</span>
          <span class="photo-caption">A place to remember</span>
        </div>

      </button>

      <!-- PHOTO 03 -->

      <button class="photo-card" data-category="moments"
              aria-label="Moment photograph">

        <span class="photo-number">03</span>

        <div class="photo-placeholder"
             style="--glow:#9b7398;--shade1:#51405e;--shade2:#202b42">

          <span class="placeholder-icon">✧</span>
          <span class="placeholder-text">Add your photo</span>

        </div>

        <div class="photo-expand">↗</div>

        <div class="photo-overlay">
          <span class="photo-category">Moments</span>
          <span class="photo-caption">A little moment</span>
        </div>

      </button>

      <!-- PHOTO 04 -->

      <button class="photo-card" data-category="nature"
              aria-label="Nature photograph">

        <span class="photo-number">04</span>

        <div class="photo-placeholder"
             style="--glow:#65a783;--shade1:#285849;--shade2:#152c37">

          <span class="placeholder-icon">✧</span>
          <span class="placeholder-text">Add your photo</span>

        </div>

        <div class="photo-expand">↗</div>

        <div class="photo-overlay">
          <span class="photo-category">Nature</span>
          <span class="photo-caption">The outdoors</span>
        </div>

      </button>

      <!-- PHOTO 05 -->

      <button class="photo-card" data-category="details"
              aria-label="Detail photograph">

        <span class="photo-number">05</span>

        <div class="photo-placeholder"
             style="--glow:#a67c56;--shade1:#644b38;--shade2:#242838">

          <span class="placeholder-icon">✧</span>
          <span class="placeholder-text">Add your photo</span>

        </div>

        <div class="photo-expand">↗</div>

        <div class="photo-overlay">
          <span class="photo-category">Details</span>
          <span class="photo-caption">Little details</span>
        </div>

      </button>

      <!-- PHOTO 06 -->

      <button class="photo-card" data-category="places"
              aria-label="Place photograph">

        <span class="photo-number">06</span>

        <div class="photo-placeholder"
             style="--glow:#6b9cac;--shade1:#385a6c;--shade2:#1b2938">

          <span class="placeholder-icon">✧</span>
          <span class="placeholder-text">Add your photo</span>

        </div>

        <div class="photo-expand">↗</div>

        <div class="photo-overlay">
          <span class="photo-category">Places</span>
          <span class="photo-caption">Somewhere beautiful</span>
        </div>

      </button>

      <!-- PHOTO 07 -->

      <button class="photo-card" data-category="moments"
              aria-label="Moment photograph">

        <span class="photo-number">07</span>

        <div class="photo-placeholder"
             style="--glow:#a18d70;--shade1:#655743;--shade2:#2c2933">

          <span class="placeholder-icon">✧</span>
          <span class="placeholder-text">Add your photo</span>

        </div>

        <div class="photo-expand">↗</div>

        <div class="photo-overlay">
          <span class="photo-category">Moments</span>
          <span class="photo-caption">Captured in time</span>
        </div>

      </button>

      <!-- PHOTO 08 -->

      <button class="photo-card" data-category="details"
              aria-label="Detail photograph">

        <span class="photo-number">08</span>

        <div class="photo-placeholder"
             style="--glow:#529c9b;--shade1:#315b64;--shade2:#172a3b">

          <span class="placeholder-icon">✧</span>
          <span class="placeholder-text">Add your photo</span>

        </div>

        <div class="photo-expand">↗</div>

        <div class="photo-overlay">
          <span class="photo-category">Details</span>
          <span class="photo-caption">The little things</span>
        </div>

      </button>

    </div>

    <div class="empty-message" id="emptyMessage">
      No photographs in this category yet.
    </div>

  </main>

  <!-- FULL-SCREEN PHOTO VIEWER -->

  <div class="lightbox" id="lightbox"
       role="dialog" aria-modal="true"
       aria-label="Photo viewer">

    <button class="lightbox-close"
            id="closeLightbox"
            aria-label="Close photo viewer">
      ×
    </button>

    <img src="" alt="Expanded photograph" id="lightboxImage">

  </div>

  <!-- FOOTER -->

  <footer>
    <span>© Muhammad Rayees</span>
    <a href="/">muhammad.rayees.org</a>
  </footer>

  <!-- JAVASCRIPT -->

  <script>

    // CATEGORY FILTERS

    const filters = document.querySelectorAll(".filter");
    const cards = document.querySelectorAll(".photo-card");
    const emptyMessage = document.getElementById("emptyMessage");

    filters.forEach(filter => {

      filter.addEventListener("click", () => {

        filters.forEach(button =>
          button.classList.remove("active")
        );

        filter.classList.add("active");

        const category = filter.dataset.filter;
        let visibleCount = 0;

        cards.forEach(card => {

          const matches =
            category === "all" ||
            card.dataset.category === category;

          card.classList.toggle("hidden", !matches);

          if (matches) visibleCount++;

        });

        emptyMessage.style.display =
          visibleCount === 0 ? "block" : "none";

      });

    });


    // PHOTO VIEWER

    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const closeLightbox = document.getElementById("closeLightbox");

    cards.forEach(card => {

      card.addEventListener("click", () => {

        const image = card.querySelector(".photo-image");

        // Empty placeholders don't open the viewer.

        if (!image) return;

        lightboxImage.src = image.src;
        lightboxImage.alt = image.alt || "Photograph";

        lightbox.classList.add("open");
        document.body.style.overflow = "hidden";

      });

    });

    function closeViewer() {
      lightbox.classList.remove("open");
      document.body.style.overflow = "";
      lightboxImage.src = "";
    }

    closeLightbox.addEventListener("click", closeViewer);

    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) {
        closeViewer();
      }
    });

    document.addEventListener("keydown", event => {

      if (event.key === "Escape") {
        closeViewer();
      }

    });

  </script>

</body>
</html>
