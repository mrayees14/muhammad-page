
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Photos — Muhammad Rayees</title>

  <link rel="icon" href="https://i.imgur.com/LJmJAy9.png">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap');

    :root {
      --background: #101313;
      --surface: #191e1e;
      --text: #f4f5f2;
      --muted: #929b98;
      --turquoise: #20b9b5;
      --gold: #d4af37;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--background);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* NAVIGATION */

    .navbar {
      width: 100%;
      padding: 22px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      width: 48px;
      height: 48px;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .nav-links a {
      color: #b7c0bd;
      font-size: 0.9rem;
      transition: color 0.25s ease;
    }

    .nav-links a:hover {
      color: var(--turquoise);
    }

    /* HERO */

    .hero {
      max-width: 1300px;
      margin: auto;
      padding: 105px 7% 65px;
    }

    .eyebrow {
      color: var(--turquoise);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(3.5rem, 8vw, 7rem);
      line-height: 1.05;
      letter-spacing: -0.045em;
      font-weight: 500;
    }

    .hero h1 span {
      color: var(--turquoise);
    }

    .hero-description {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.8;
      max-width: 490px;
      margin-top: 25px;
    }

    .hero-line {
      margin-top: 55px;
      width: 75px;
      height: 3px;
      background: var(--turquoise);
      border-radius: 10px;
    }

    /* GALLERY */

    .gallery-section {
      max-width: 1500px;
      margin: auto;
      padding: 20px 7% 110px;
    }

    .gallery-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 25px;
      margin-bottom: 35px;
    }

    .gallery-heading {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .gallery-count {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 6px;
    }

    /* FILTERS */

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .filter-btn {
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: #aeb8b4;
      padding: 10px 17px;
      border-radius: 30px;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--turquoise);
      color: #071414;
      border-color: var(--turquoise);
    }

    /* PHOTO GRID */

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: 75px;
      gap: 17px;
    }

    .photo-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 17px;
      background: var(--surface);
      cursor: pointer;
      text-align: left;
      min-width: 0;
      isolation: isolate;
      font-family: inherit;
      color: inherit;
    }

    .photo-card:focus-visible,
    .filter-btn:focus-visible {
      outline: 2px solid var(--turquoise);
      outline-offset: 4px;
    }

    .photo-card:nth-child(1) {
      grid-column: span 7;
      grid-row: span 5;
    }

    .photo-card:nth-child(2) {
      grid-column: span 5;
      grid-row: span 4;
    }

    .photo-card:nth-child(3) {
      grid-column: span 5;
      grid-row: span 4;
    }

    .photo-card:nth-child(4) {
      grid-column: span 7;
      grid-row: span 5;
    }

    .photo-card:nth-child(5),
    .photo-card:nth-child(6),
    .photo-card:nth-child(7) {
      grid-column: span 4;
      grid-row: span 4;
    }

    .photo-card:nth-child(8) {
      grid-column: span 6;
      grid-row: span 5;
    }

    .photo-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.7s cubic-bezier(.2,.7,.2,1);
    }

    .photo-card:hover .photo-image {
      transform: scale(1.055);
    }

    /* PHOTO OVERLAY */

    .photo-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.83),
        rgba(0,0,0,0.1) 55%,
        transparent
      );
      z-index: 2;
    }

    .photo-category {
      color: rgba(255,255,255,0.75);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    .photo-caption {
      margin-top: 7px;
      font-size: 1.15rem;
      font-weight: 750;
      letter-spacing: -.025em;
      color: var(--turquoise);
    }

    .photo-number {
      position: absolute;
      z-index: 3;
      top: 18px;
      left: 20px;
      font-size: 0.75rem;
      color: white;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(12px);
      padding: 8px 11px;
      border-radius: 20px;
    }

    .photo-expand {
      position: absolute;
      z-index: 3;
      top: 17px;
      right: 18px;
      width: 37px;
      height: 37px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.17);
      backdrop-filter: blur(12px);
      color: white;
      font-size: 1.1rem;
      opacity: 0;
      transform: translateY(5px);
      transition: 0.25s ease;
    }

    .photo-card:hover .photo-expand,
    .photo-card:focus-visible .photo-expand {
      opacity: 1;
      transform: translateY(0);
    }

    /* LIGHTBOX */

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 35px;
      background: rgba(0,0,0,0.94);
      backdrop-filter: blur(15px);
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-content {
      position: relative;
      max-width: 1100px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 78vh;
      object-fit: contain;
      border-radius: 12px;
    }

    .lightbox-caption {
      margin-top: 18px;
      color: var(--turquoise);
      font-weight: 700;
      text-align: center;
    }

    .lightbox-close {
      position: absolute;
      top: -45px;
      right: 0;
      border: none;
      background: transparent;
      color: white;
      font-size: 2rem;
      cursor: pointer;
    }

    .lightbox-close:focus-visible {
      outline: 2px solid var(--turquoise);
      outline-offset: 4px;
    }

    /* FOOTER */

    footer {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 35px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.8rem;
    }

    /* RESPONSIVE */

    @media (max-width: 800px) {
      .hero {
        padding-top: 75px;
      }

      .photo-grid {
        grid-auto-rows: 65px;
        gap: 12px;
      }

      .photo-card:nth-child(n) {
        grid-column: span 6;
        grid-row: span 4;
      }

      .photo-card:nth-child(1),
      .photo-card:nth-child(4) {
        grid-column: span 12;
        grid-row: span 4;
      }

      .photo-overlay {
        padding: 17px;
      }
    }

    @media (max-width: 520px) {
      .navbar {
        padding: 17px 6%;
      }

      .nav-links {
        gap: 15px;
      }

      .nav-links a {
        font-size: 0.8rem;
      }

      .hero {
        padding: 70px 6% 50px;
      }

      .gallery-section {
        padding: 15px 6% 75px;
      }

      .photo-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 190px;
        gap: 11px;
      }

      .photo-card:nth-child(n) {
        grid-column: span 1;
        grid-row: span 1;
      }

      .photo-card:nth-child(1),
      .photo-card:nth-child(4),
      .photo-card:nth-child(8) {
        grid-column: span 2;
      }

      .photo-caption {
        font-size: 1rem;
      }

      .photo-overlay {
        padding: 13px;
      }

      .photo-number {
        top: 11px;
        left: 11px;
      }

      .photo-expand {
        top: 10px;
        right: 10px;
      }

      .lightbox {
        padding: 15px;
      }
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->

  <nav class="navbar">

    <a href="/" class="logo" aria-label="Home">
      <img
        src="https://i.imgur.com/LJmJAy9.png"
        alt="MR Nether Crystal Logo"
      >
    </a>

    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/photos/">Photos</a>
      <a href="mailto:muhammad@rayees.org">Email</a>
    </div>

  </nav>

  <!-- HERO -->

  <header class="hero">

    <p class="eyebrow">The Photo Collection</p>

    <h1>
      Stunning<br>
      <span>Views</span>
    </h1>

    <p class="hero-description">
      A collection that showcases my photography skills.
    </p>

    <div class="hero-line"></div>

  </header>

  <!-- GALLERY -->

  <main class="gallery-section">

    <div class="gallery-top">

      <div>
        <h2 class="gallery-heading">Selected photographs</h2>
        <span class="gallery-count">A collection of my best photography</span>
      </div>

      <div class="filters">

        <button class="filter-btn active" data-filter="all" aria-pressed="true">
          All
        </button>

        <button class="filter-btn" data-filter="nature" aria-pressed="false">
          Nature
        </button>

        <button class="filter-btn" data-filter="travel" aria-pressed="false">
          Travel
        </button>

        <button class="filter-btn" data-filter="city" aria-pressed="false">
          City
        </button>

      </div>

    </div>

    <div class="photo-grid">

      <!-- PHOTO 1 -->

      <button class="photo-card"
              data-category="nature"
              aria-label="View Icecapped Mountains photograph">

        <span class="photo-number">01</span>

        <img
          class="photo-image"
          src="https://i.imgur.com/bBhZqtx.jpeg"
          alt="Icecapped mountain landscape"
          loading="lazy"
        >

        <span class="photo-expand" aria-hidden="true">↗</span>

        <span class="photo-overlay">
          <span class="photo-category">Nature</span>
          <span class="photo-caption">Icecapped Mountains in Seattle, Washington</span>
        </span>

      </button>

      <!-- PHOTO 2 -->

      <button class="photo-card"
              data-category="nature"
              aria-label="View Sierra Vista photograph">

        <span class="photo-number">02</span>

        <img
          class="photo-image"
          src="https://i.imgur.com/17rMHAK.jpeg"
          alt="Landscape in Sierra Vista, California"
          loading="lazy"
        >

        <span class="photo-expand" aria-hidden="true">↗</span>

        <span class="photo-overlay">
          <span class="photo-category">Nature</span>
          <span class="photo-caption">Sierra Vista, CA</span>
        </span>

      </button>

      <!-- PHOTO 3 -->

      <button class="photo-card"
              data-category="travel"
              aria-label="View Shibuya, Japan photograph">

        <span class="photo-number">03</span>

        <img
          class="photo-image"
          src="https://i.imgur.com/7sfYkGx.jpeg"
          alt="Street scene in Shibuya, Japan"
          loading="lazy"
        >

        <span class="photo-expand" aria-hidden="true">↗</span>

        <span class="photo-overlay">
          <span class="photo-category">Travel</span>
          <span class="photo-caption">Shibuya, Japan</span>
        </span>

      </button>

      <!-- PHOTO 4 -->

      <button class="photo-card"
              data-category="city"
              aria-label="View San Francisco sunset photograph">

        <span class="photo-number">04</span>

        <img
          class="photo-image"
          src="https://i.imgur.com/U1JQRhM.jpeg"
          alt="San Francisco city view at sunset"
          loading="lazy"
        >

        <span class="photo-expand" aria-hidden="true">↗</span>

        <span class="photo-overlay">
          <span class="photo-category">Cityview</span>
          <span class="photo-caption">San Francisco, CA Sunset</span>
        </span>

      </button>

      <!-- PHOTO 5 -->

      <button class="photo-card"
              data-category="nature"
              aria-label="View lake landscape photograph">

        <span class="photo-number">05</span>

        <img
          class="photo-image"
          src="https://i.imgur.com/31ckjHT.jpeg"
          alt="Lake surrounded by natural scenery"
          loading="lazy"
        >

        <span class="photo-expand" aria-hidden="true">↗</span>

        <span class="photo-overlay">
          <span class="photo-category">Nature</span>
          <span class="photo-caption">Lake with stunning views in Seattle, Washington</span>
        </span>

      </button>

      <!-- PHOTO 6 -->

      <button class="photo-card"
              data-category="city"
              aria-label="View San Francisco city photograph">

        <span class="photo-number">06</span>

        <img
          class="photo-image"
          src="https://i.imgur.com/ODIrTz7.jpeg"
          alt="City view of San Francisco, California"
          loading="lazy"
        >

        <span class="photo-expand" aria-hidden="true">↗</span>

        <span class="photo-overlay">
          <span class="photo-category">Cityview</span>
          <span class="photo-caption">San Francisco, CA</span>
        </span>

      </button>

      <!-- PHOTO 7 -->

      <button class="photo-card"
              data-category="travel"
              aria-label="View Tokyo, Japan photograph">

        <span class="photo-number">07</span>

        <img
          class="photo-image"
          src="https://i.imgur.com/5uHwmwN.jpeg"
          alt="Travel photograph from Tokyo, Japan"
          loading="lazy"
        >

        <span class="photo-expand" aria-hidden="true">↗</span>

        <span class="photo-overlay">
          <span class="photo-category">Travel</span>
          <span class="photo-caption">Tokyo, Japan</span>
        </span>

      </button>

      <!-- PHOTO 8 -->

      <button class="photo-card"
              data-category="travel"
              aria-label="View Kyoto, Japan photograph">

        <span class="photo-number">08</span>

        <img
          class="photo-image"
          src="https://i.imgur.com/cLtYfTz.jpeg"
          alt="Travel photograph from Kyoto, Japan"
          loading="lazy"
        >

        <span class="photo-expand" aria-hidden="true">↗</span>

        <span class="photo-overlay">
          <span class="photo-category">Travel</span>
          <span class="photo-caption">Kyoto, Japan</span>
        </span>

      </button>

    </div>

  </main>

  <!-- LIGHTBOX -->

  <div class="lightbox"
       id="lightbox"
       aria-modal="true"
       role="dialog"
       aria-label="Photo viewer"
       aria-hidden="true"
       inert>

    <div class="lightbox-content">

      <button class="lightbox-close"
              id="lightboxClose"
              aria-label="Close photo viewer">
        ×
      </button>

      <img id="lightboxImage" src="" alt="">

      <p class="lightbox-caption" id="lightboxCaption"></p>

    </div>

  </div>

  <!-- FOOTER -->

  <footer>
    <p>© 2026 Muhammad Rayees</p>
  </footer>

  <!-- JAVASCRIPT -->

  <script>

    // CATEGORY FILTERS

    const filterButtons = document.querySelectorAll(".filter-btn");
    const photoCards = document.querySelectorAll(".photo-card");

    filterButtons.forEach(button => {

      button.addEventListener("click", () => {

        const selectedFilter = button.dataset.filter;

        filterButtons.forEach(btn => {
          btn.classList.remove("active");
          btn.setAttribute("aria-pressed", "false");
        });

        button.classList.add("active");
        button.setAttribute("aria-pressed", "true");

        photoCards.forEach(card => {

          const category = card.dataset.category;

          if (selectedFilter === "all" || category === selectedFilter) {
            card.hidden = false;
          } else {
            card.hidden = true;
          }

        });

      });

    });


    // LIGHTBOX

    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const lightboxCaption = document.getElementById("lightboxCaption");
    const lightboxClose = document.getElementById("lightboxClose");

    let lastFocusedCard = null;


    // OPEN A PHOTO

    photoCards.forEach(card => {

      card.addEventListener("click", () => {

        const image = card.querySelector(".photo-image");

        if (!image) return;

        lastFocusedCard = card;

        lightboxImage.src = image.src;
        lightboxImage.alt = image.alt;

        const caption = card.querySelector(".photo-caption");

        lightboxCaption.textContent = caption
          ? caption.textContent
          : image.alt;

        lightbox.inert = false;
        lightbox.setAttribute("aria-hidden", "false");
        lightbox.classList.add("open");

        document.body.style.overflow = "hidden";

        lightboxClose.focus();

      });

    });


    // CLOSE THE PHOTO VIEWER

    function closeLightbox() {

      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden", "true");
      lightbox.inert = true;

      lightboxImage.src = "";
      lightboxImage.alt = "";

      document.body.style.overflow = "";

      if (lastFocusedCard && !lastFocusedCard.hidden) {
        lastFocusedCard.focus();
      }

    }

    lightboxClose.addEventListener("click", closeLightbox);


    // CLOSE WHEN CLICKING OUTSIDE THE PHOTO

    lightbox.addEventListener("click", event => {

      if (event.target === lightbox) {
        closeLightbox();
      }

    });


    // CLOSE WITH ESCAPE KEY

    document.addEventListener("keydown", event => {

      if (event.key === "Escape" && lightbox.classList.contains("open")) {
        closeLightbox();
      }

    });

  </script>

</body>
</html>
